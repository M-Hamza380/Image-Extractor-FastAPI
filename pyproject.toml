[project]
name = "image-extractor-fastapi"
version = "0.0.1"
description = "A fastapi image extractor tool to perform OCR with different models."
authors = [
    {name = "M-Hamza380",email = "hamza.anjum380@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi >=0.115.12,<0.116.0",
    "uvicorn >=0.34.2,<0.35.0",
    "jinja2 >=3.1.6,<4.0.0",
    "python-multipart >=0.0.20,<0.0.21",
    "aiofiles >=24.1.0,<25.0.0",
    "python-dotenv >=1.1.0,<2.0.0",
    "colorama >=0.4.6,<0.5.0",
    "pillow >=11.2.1,<12.0.0",
    "opencv-python >=4.11.0.86,<5.0.0.0",
    "gunicorn >=23.0.0,<24.0.0",
    "pytest >=8.3.5,<9.0.0",
    "requests >=2.32.3,<3.0.0",
    "flake8 >=7.2.0,<8.0.0",
    "black >=25.1.0,<26.0.0",
    "pre-commit >=4.2.0,<5.0.0",
    "isort >=6.0.1,<7.0.0",
    "httpx (>=0.28.1,<0.29.0)",
    "pytesseract (>=0.3.13,<0.4.0)",
    "paddlepaddle (>=3.0.0,<4.0.0)",
    "easyocr (>=1.7.2,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
